events {}

http {

    upstream auth_service {
        server host.docker.internal:5001;
    }

    upstream kyc_service {
        server host.docker.internal:5002;
    }

    upstream account_service {
        server host.docker.internal:5003;
    }

    upstream transaction_service {
        server host.docker.internal:5004;
    }

    upstream notification_service {
        server host.docker.internal:5005;
    }

    server {

        listen 80;

        location /api/auth {
    proxy_pass http://auth_service;

    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
}

location /api/users {
    proxy_pass http://auth_service;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/kyc {
    proxy_pass http://kyc_service;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
}

location /api/accounts {
    proxy_pass http://account_service;

    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
}

location /api/transactions {
    proxy_pass http://transaction_service;

    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
}

        # location /api/auth/ {
        #     proxy_pass http://auth_service;
        # }

        # location /api/kyc/ {
        #     proxy_pass http://kyc_service;
        # }

        # location /api/accounts/ {
        #     proxy_pass http://account_service;
        # }

        # location /api/transactions/ {
        #     proxy_pass http://transaction_service;
        # }

        location /api/notifications {
            proxy_pass http://notification_service;
        }

        location /health {
            return 200 "API Gateway Running 5000";
        }
    }
}