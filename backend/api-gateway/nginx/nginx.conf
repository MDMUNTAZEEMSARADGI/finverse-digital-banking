events {}

http {

    server {

        listen 80;

        # ==========================================
        # CORS
        # ==========================================

        add_header Access-Control-Allow-Origin "https://finverse-phi.vercel.app" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }


        # ==========================================
        # AUTH SERVICE
        # ==========================================

        location /api/auth {

            proxy_pass https://finverse-digital-banking.onrender.com;

            proxy_ssl_server_name on;
            proxy_ssl_name finverse-digital-banking.onrender.com;

            proxy_set_header Host finverse-digital-banking.onrender.com;

            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
        }


        # ==========================================
        # KYC SERVICE
        # ==========================================

        location /api/kyc {

            proxy_pass https://finverse-digital-banking-2.onrender.com;

            proxy_ssl_server_name on;
            proxy_ssl_name finverse-digital-banking-2.onrender.com;

            proxy_set_header Host finverse-digital-banking-2.onrender.com;

            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
        }


        # ==========================================
        # ACCOUNT SERVICE
        # ==========================================

        location /api/accounts {

            proxy_pass https://finverse-digital-banking-1.onrender.com;

            proxy_ssl_server_name on;
            proxy_ssl_name finverse-digital-banking-1.onrender.com;

            proxy_set_header Host finverse-digital-banking-1.onrender.com;

            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
        }


        # ==========================================
        # TRANSACTION SERVICE
        # ==========================================

        location /api/transactions {

            proxy_pass https://finverse-transaction.onrender.com;

            proxy_ssl_server_name on;
            proxy_ssl_name finverse-transaction.onrender.com;

            proxy_set_header Host finverse-transaction.onrender.com;

            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
        }


        # ==========================================
        # NOTIFICATION SERVICE
        # ==========================================

        location /api/notifications {

            proxy_pass https://finverse-notification.onrender.com;

            proxy_ssl_server_name on;
            proxy_ssl_name finverse-notification.onrender.com;

            proxy_set_header Host finverse-notification.onrender.com;

            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
        }


        # ==========================================
        # HEALTH
        # ==========================================

        location /health {

            add_header Content-Type text/plain;

            return 200 "API Gateway Running";
        }
    }
}

